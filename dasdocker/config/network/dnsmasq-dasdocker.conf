# dnsmasq sinkhole for dasdocker-isolated (NET-ISO-ARCH-001 §D).
# Deploy: copied to /etc/dasdocker/network/dnsmasq-dasdocker.conf by setup-network.sh
#
# Rule 1 (ZTA): bind ONLY to sandbox gateway IP — never 0.0.0.0 (T-S08-002 SSRF/metadata class).
listen-address=172.31.0.1
bind-interfaces
except-interface=lo
user=dnsmasq
group=dnsmasq
port=53
pid-file=/run/dasdocker-dnsmasq.pid
dns-forward-max=250
domain-needed
bogus-priv

# Rule 3: upstreams parameterized at install — defaults here; automation may replace (ADR env registry).
server=1.1.1.1
server=8.8.8.8

# Block internal / mDNS-ish suffixes via local= (NXDOMAIN — T-S08-002 T-S08-003)
local=/corp/
local=/internal/
local=/lan/
local=/local/
local=/home/

# Timestamped query log (daemon writes to syslog when log-facility unset; systemd unit redirects to file)
log-queries
