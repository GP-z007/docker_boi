[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    User          fluentbit

[INPUT]
    Name          tail
    Path          /var/lib/docker/containers/*/*.log
    Parser        docker
    Tag           docker.*
    Mem_Buf_Limit 50MB
    Skip_Long_Lines On
    Refresh_Interval 5

[FILTER]
    Name          modify
    Match         docker.*
    Add           event_source docker
    Add           severity info

[FILTER]
    Name          rewrite_tag
    Match         docker.*
    Rule          $container_name ^dasdocker-sess-(?<session>[A-Za-z0-9._-]+)$ session.$session true
    Emitter_Name  session_rewriter

[FILTER]
    Name          record_modifier
    Match         session.*
    Record        session_id ${TAG}

[FILTER]
    Name          modify
    Match         session.*
    # Strip secrets/token-looking content before persistence.
    Hard_rename   log raw_log

[FILTER]
    Name          lua
    Match         session.*
    script        /fluent-bit/etc/redact.lua
    call          redact_log

[OUTPUT]
    Name          loki
    Match         session.*
    Host          ${LOKI_HOST}
    Port          ${LOKI_PORT}
    Labels        session_id=${session_id},event_source=${event_source},severity=${severity}
    Line_Format   json
    Remove_Keys   stream,time
