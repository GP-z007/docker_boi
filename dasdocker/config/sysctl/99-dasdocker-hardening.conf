# dasDocker host kernel sysctl — binds ADR-008 D-001 (Ubuntu 22.04 hardening gate) &
# STRIDE Host Kernel surface (S-05). Apply: copy to /etc/sysctl.d/ && sysctl --system
#
# Permissions: root:root 0644 — world-readable sysctl drop-ins are OS default; values are non-secret.

# kernel.unprivileged_userns_clone=0 — Mitigates unprivileged user namespace abuse enabling
# container-adjacent local EoP & mount trickery (T-S05-001 Elevation of Privilege, T-S05-003 DoS).
kernel.unprivileged_userns_clone = 0

# kernel.dmesg_restrict=1 — Restricts unprivileged dmesg reads leaking kernel hints (T-S05-002
# Information Disclosure).
kernel.dmesg_restrict = 1

# kernel.kptr_restrict=2 — Hides kernel symbols from unprivileged contexts (T-S05-002
# Information Disclosure; supports SMEP/SMAP-assisted exploit chain resistance).
kernel.kptr_restrict = 2

# kernel.unprivileged_bpf_disabled=1 — Blocks unprivileged BPF program loads (T-S07-001
# Elevation of Privilege on eBPF verifier / program surface).
kernel.unprivileged_bpf_disabled = 1

# kernel.yama.ptrace_scope=2 — Limits cross-user ptrace attaching (T-S04-002 Elevation of Privilege,
# T-S05-001 host integrity).
kernel.yama.ptrace_scope = 2

# fs.protected_hardlinks=1 — Prevents unsafe hardlink-based TOCTOU across privilege boundaries
# (T-S03-002 Tampering / zip and filesystem abuse class on shared nodes).
fs.protected_hardlinks = 1

# fs.protected_symlinks=1 — Resolves symlinks safely for sticky-world dirs (T-S03-002 Tampering).
fs.protected_symlinks = 1

# fs.suid_dumpable=0 — Disables core dumps of setuid binaries reducing secret leakage
# (T-S03-003 Information Disclosure).
fs.suid_dumpable = 0

# net.ipv4.conf.all.rp_filter=1 — Strict reverse-path filtering reduces IP spoofing reach
# toward control-plane listeners (T-S08-001 Spoofing).
net.ipv4.conf.all.rp_filter = 1

# net.ipv4.conf.default.rp_filter=1 — Default for new interfaces; same control (T-S08-001).
net.ipv4.conf.default.rp_filter = 1

# net.ipv4.conf.all.accept_redirects=0 — Ignores ICMP redirects reducing route injection
# (T-S08-002 Tampering).
net.ipv4.conf.all.accept_redirects = 0

# net.ipv4.conf.default.accept_redirects=0 — Default for new interfaces (T-S08-002).
net.ipv4.conf.default.accept_redirects = 0

# net.ipv4.conf.all.send_redirects=0 — Host does not emit ICMP redirects (T-S08-001 / lateral
# network confusion).
net.ipv4.conf.all.send_redirects = 0

# net.ipv4.icmp_echo_ignore_broadcasts=1 — Mitigates smurf-style ICMP amplification DoS
# (T-S08-004 Denial of Service class on shared infrastructure).
net.ipv4.icmp_echo_ignore_broadcasts = 1
